<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Tiny Question ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <p class="small-title">HEY THÙY VÂN 🌷</p>

<h1>
    Cô gái hoạt náo<br>
    <span>đi khám phá ẩm thực </span> với anh nhoa
</h1>

<p class="subtitle">
    Choose wisely... hình như chỉ có một đáp án đúng 😌
</p>

        <div class="flower">
            🌸
        </div>

        <div class="buttons">

            <button id="yesBtn">
                YES
            </button>

            <button id="noBtn">
                No
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
